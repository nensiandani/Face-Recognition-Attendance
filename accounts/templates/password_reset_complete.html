{% load static %}
{% include 'header.html' %}

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root { --primary: #ff7b00; --primary-glow: rgba(255,123,0,0.5); --bg-dark: #060912; --text-muted: #5a6a8a; --text-sub: #94a3b8; --cyber-blue: #00d4ff; --green: #10b981; }
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { min-height: 100vh; background: var(--bg-dark); display: flex; align-items: center; justify-content: center; color: #fff; overflow: hidden; font-family: 'Inter', sans-serif; position: relative; }
.bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bg-canvas::before { content: ''; position: absolute; inset: 0; background-image: linear-gradient(rgba(16,185,129,0.02) 1px, transparent 1px), linear-gradient(90deg, rgba(16,185,129,0.02) 1px, transparent 1px); background-size: 60px 60px; animation: gridDrift 20s linear infinite; }
@keyframes gridDrift { 0% { background-position: 0 0; } 100% { background-position: 60px 60px; } }
.bg-canvas::after { content: ''; position: absolute; inset: 0; background: radial-gradient(ellipse 70% 60% at 50% 30%, rgba(16,185,129,0.08) 0%, transparent 60%), radial-gradient(ellipse 60% 50% at 50% 70%, rgba(255,123,0,0.05) 0%, transparent 60%); animation: glowPulse 8s ease-in-out infinite alternate; }
@keyframes glowPulse { 0% { opacity: 0.8; } 100% { opacity: 1; } }
.particle { position: absolute; border-radius: 50%; animation: floatUp linear infinite; opacity: 0; }
@keyframes floatUp { 0% { transform: translateY(100vh); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 0.6; } 100% { transform: translateY(-100px); opacity: 0; } }
.scan-beam { position: fixed; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent 0%, rgba(16,185,129,0.7) 30%, rgba(255,123,0,0.5) 70%, transparent 100%); animation: scanBeam 6s linear infinite; z-index: 2; pointer-events: none; }
@keyframes scanBeam { 0% { top: 0; opacity: 0; } 5% { opacity: 1; } 95% { opacity: 0.3; } 100% { top: 100vh; opacity: 0; } }

.card {
    position: relative; z-index: 10; width: 440px;
    background: linear-gradient(145deg, rgba(8,14,30,0.95), rgba(5,10,25,0.98));
    backdrop-filter: blur(40px); border-radius: 28px;
    border: 1px solid rgba(255,255,255,0.06);
    padding: 54px 44px 48px;
    box-shadow: 0 40px 80px rgba(0,0,0,0.8);
    animation: cardIn 0.8s cubic-bezier(0.23,1,0.32,1) both;
    overflow: hidden; text-align: center;
}
@keyframes cardIn { from { opacity: 0; transform: translateY(40px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
.card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: linear-gradient(90deg, transparent 0%, #10b981 25%, #00d4ff 50%, #10b981 75%, transparent 100%); background-size: 200% 100%; animation: borderFlow 3s linear infinite; border-radius: 28px 28px 0 0; }
@keyframes borderFlow { 0% { background-position: 0% 0; } 100% { background-position: 200% 0; } }
.corner-deco { position: absolute; width: 60px; height: 60px; pointer-events: none; }
.corner-deco.tl { top: 0; left: 0; border-top: 2px solid rgba(16,185,129,0.4); border-left: 2px solid rgba(16,185,129,0.4); border-radius: 28px 0 0 0; }
.corner-deco.tr { top: 0; right: 0; border-top: 2px solid rgba(0,212,255,0.2); border-right: 2px solid rgba(0,212,255,0.2); border-radius: 0 28px 0 0; }
.corner-deco.bl { bottom: 0; left: 0; border-bottom: 2px solid rgba(0,212,255,0.2); border-left: 2px solid rgba(0,212,255,0.2); border-radius: 0 0 0 28px; }
.corner-deco.br { bottom: 0; right: 0; border-bottom: 2px solid rgba(16,185,129,0.4); border-right: 2px solid rgba(16,185,129,0.4); border-radius: 0 0 28px 0; }

/* Big animated check */
.success-wrap { position: relative; width: 100px; height: 100px; margin: 0 auto 28px; }
.outer-ring { position: absolute; inset: 0; border-radius: 50%; border: 2px solid rgba(16,185,129,0.2); animation: outerSpin 6s linear infinite; }
.inner-ring { position: absolute; inset: 8px; border-radius: 50%; border: 1px solid rgba(16,185,129,0.15); animation: outerSpin 4s linear infinite reverse; }
@keyframes outerSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
.success-circle { position: absolute; inset: 14px; border-radius: 50%; background: rgba(16,185,129,0.1); border: 1px solid rgba(16,185,129,0.3); display: flex; align-items: center; justify-content: center; animation: successGlow 2s ease-in-out infinite alternate; }
@keyframes successGlow { from { box-shadow: 0 0 15px rgba(16,185,129,0.2); } to { box-shadow: 0 0 35px rgba(16,185,129,0.5); } }
.check-anim { animation: checkPop 0.5s cubic-bezier(0.23,1,0.32,1) 0.4s both; }
@keyframes checkPop { from { opacity: 0; transform: scale(0.3) rotate(-20deg); } to { opacity: 1; transform: scale(1) rotate(0deg); } }

.cyber-label { font-family: 'Orbitron', sans-serif; font-size: 9px; color: var(--green); letter-spacing: 4px; margin-bottom: 10px; opacity: 0.9; display: flex; align-items: center; justify-content: center; gap: 12px; }
.cyber-label::before, .cyber-label::after { content: ''; width: 24px; height: 1px; background: var(--green); box-shadow: 0 0 8px var(--green); }

.card-title { font-family: 'Rajdhani', sans-serif; font-size: 32px; font-weight: 700; color: #fff; margin-bottom: 10px; }
.card-subtitle { font-family: 'Rajdhani', sans-serif; font-size: 15px; color: var(--text-sub); margin-bottom: 32px; line-height: 1.6; }

.success-badge {
    display: inline-flex; align-items: center; gap: 8px;
    background: rgba(16,185,129,0.08);
    border: 1px solid rgba(16,185,129,0.2);
    border-radius: 100px; padding: 8px 20px;
    font-family: 'Orbitron', sans-serif; font-size: 9px;
    color: var(--green); letter-spacing: 2px; margin-bottom: 28px;
    animation: badgePulse 2s ease-in-out infinite;
}
@keyframes badgePulse { 0%, 100% { box-shadow: 0 0 10px rgba(16,185,129,0.15); } 50% { box-shadow: 0 0 20px rgba(16,185,129,0.35); } }
.badge-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); animation: dotBlink 1.5s ease-in-out infinite; }
@keyframes dotBlink { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

.login-btn {
    display: block; width: 100%; padding: 16px;
    background: linear-gradient(135deg, #ff7b00 0%, #ff4400 100%);
    color: #fff; border: none; border-radius: 14px;
    cursor: pointer; font-family: 'Orbitron', sans-serif;
    font-weight: 700; font-size: 12px; letter-spacing: 3px;
    text-transform: uppercase; transition: all 0.3s cubic-bezier(0.23,1,0.32,1);
    box-shadow: 0 6px 30px rgba(255,123,0,0.35);
    text-decoration: none; position: relative; overflow: hidden;
}
.login-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent); transition: left 0.5s; }
.login-btn:hover::before { left: 120%; }
.login-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(255,123,0,0.6); }
.login-btn:active { transform: translateY(-1px); }

.hud-status { margin-top: 20px; font-family: 'Orbitron', monospace; font-size: 8px; color: var(--text-muted); letter-spacing: 2px; opacity: 0.4; }

/* ═══════════════════════════════════════════════════
   RESPONSIVE – FORM PAGES (login/register/otp/password)
═══════════════════════════════════════════════════ */

/* Prevent iOS zoom on input focus */
input, select, textarea {
    font-size: 16px !important;
}

/* General */
body, html {
    overflow-x: hidden;
    max-width: 100vw;
}

img {
    max-width: 100%;
}

/* ── Tablet ── */
@media (max-width: 768px) {
    .login-card,
    .register-card,
    .card,
    .auth-card {
        width: 92vw !important;
        max-width: 480px !important;
        padding: 36px 24px 32px !important;
        border-radius: 18px !important;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="number"],
    input[type="tel"] {
        font-size: 16px !important;
        min-height: 48px !important;
    }

    button[type="submit"],
    .login-btn,
    .register-btn,
    .submit-btn,
    .reset-btn {
        min-height: 48px !important;
        font-size: 14px !important;
        width: 100% !important;
    }
}

/* ── Mobile ── */
@media (max-width: 480px) {
    .login-card,
    .register-card,
    .card,
    .auth-card {
        width: 95vw !important;
        padding: 28px 18px 24px !important;
    }

    .logo-wrap img {
        width: 130px !important;
    }

    .form-row {
        flex-direction: column !important;
        gap: 0 !important;
    }
}

</style>

<div class="bg-canvas" id="bgCanvas"></div>
<div class="scan-beam"></div>

<div class="card">
    <div class="corner-deco tl"></div><div class="corner-deco tr"></div>
    <div class="corner-deco bl"></div><div class="corner-deco br"></div>

    <div class="success-wrap">
        <div class="outer-ring"></div>
        <div class="inner-ring"></div>
        <div class="success-circle">
            <svg class="check-anim" width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
    </div>

    <div class="cyber-label">Access Restored</div>
    <div class="card-title">Password Updated!</div>
    <div class="card-subtitle">Your password has been changed successfully. You can now log in with your new credentials.</div>

    <div class="success-badge">
        <div class="badge-dot"></div>
        CREDENTIALS UPDATED
    </div>

    <a href="{% url 'login' %}" class="login-btn">
        Login Now
    </a>
    <div class="hud-status">AUTH-COMPLETE ◈ LookIn AI v2.0 ◈ ACCESS GRANTED</div>
</div>

<script>
(function() {
    const canvas = document.getElementById('bgCanvas');
    const colors = ['rgba(16,185,129,', 'rgba(0,212,255,', 'rgba(255,123,0,'];
    for (let i = 0; i < 30; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 3 + 1;
        const color = colors[Math.floor(Math.random() * colors.length)];
        const opacity = Math.random() * 0.4 + 0.1;
        p.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;background:${color}${opacity});box-shadow:0 0 ${size*3}px ${color}0.6);animation-duration:${Math.random()*15+10}s;animation-delay:${Math.random()*10}s;`;
        canvas.appendChild(p);
    }
})();
</script>
