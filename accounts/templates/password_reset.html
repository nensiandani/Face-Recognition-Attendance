{% load static %}
{% include 'header.html' %}

<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
    --primary: #ff7b00;
    --primary-dim: rgba(255,123,0,0.15);
    --primary-glow: rgba(255,123,0,0.5);
    --bg-dark: #060912;
    --glass-border: rgba(255,255,255,0.06);
    --text-muted: #5a6a8a;
    --text-sub: #94a3b8;
    --cyber-blue: #00d4ff;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
    min-height: 100vh;
    background: var(--bg-dark);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    overflow: hidden;
    font-family: 'Inter', sans-serif;
    position: relative;
}
.bg-canvas { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bg-canvas::before {
    content: '';
    position: absolute; inset: 0;
    background-image: linear-gradient(rgba(255,123,0,0.025) 1px, transparent 1px), linear-gradient(90deg, rgba(255,123,0,0.025) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: gridDrift 20s linear infinite;
}
@keyframes gridDrift { 0% { background-position: 0 0; } 100% { background-position: 60px 60px; } }
.bg-canvas::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse 80% 60% at 15% 15%, rgba(255,123,0,0.07) 0%, transparent 60%), radial-gradient(ellipse 60% 50% at 85% 85%, rgba(0,212,255,0.05) 0%, transparent 60%);
    animation: glowPulse 8s ease-in-out infinite alternate;
}
@keyframes glowPulse { 0% { opacity: 0.8; } 100% { opacity: 1; } }
.particle { position: absolute; border-radius: 50%; animation: floatUp linear infinite; opacity: 0; }
@keyframes floatUp { 0% { transform: translateY(100vh); opacity: 0; } 10% { opacity: 1; } 90% { opacity: 0.6; } 100% { transform: translateY(-100px); opacity: 0; } }
.scan-beam { position: fixed; top: 0; left: 0; right: 0; height: 1px; background: linear-gradient(90deg, transparent 0%, rgba(255,123,0,0.6) 30%, rgba(0,212,255,0.6) 70%, transparent 100%); animation: scanBeam 6s linear infinite; z-index: 2; pointer-events: none; }
@keyframes scanBeam { 0% { top: 0; opacity: 0; } 5% { opacity: 1; } 95% { opacity: 0.3; } 100% { top: 100vh; opacity: 0; } }

.card {
    position: relative; z-index: 10;
    width: 440px;
    background: linear-gradient(145deg, rgba(8,14,30,0.95), rgba(5,10,25,0.98));
    backdrop-filter: blur(40px);
    border-radius: 28px;
    border: 1px solid rgba(255,255,255,0.06);
    padding: 50px 44px 44px;
    box-shadow: 0 40px 80px rgba(0,0,0,0.8);
    animation: cardIn 0.8s cubic-bezier(0.23,1,0.32,1) both;
    overflow: hidden;
    text-align: center;
}
@keyframes cardIn { from { opacity: 0; transform: translateY(40px) scale(0.96); } to { opacity: 1; transform: translateY(0) scale(1); } }
.card::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0; height: 2px;
    background: linear-gradient(90deg, transparent 0%, #ff7b00 20%, #ff007b 40%, #7b2fff 60%, #00d4ff 80%, transparent 100%);
    background-size: 200% 100%;
    animation: borderFlow 3s linear infinite;
    border-radius: 28px 28px 0 0;
}
@keyframes borderFlow { 0% { background-position: 0% 0; } 100% { background-position: 200% 0; } }
.corner-deco { position: absolute; width: 60px; height: 60px; pointer-events: none; }
.corner-deco.tl { top: 0; left: 0; border-top: 2px solid rgba(255,123,0,0.3); border-left: 2px solid rgba(255,123,0,0.3); border-radius: 28px 0 0 0; }
.corner-deco.tr { top: 0; right: 0; border-top: 2px solid rgba(0,212,255,0.2); border-right: 2px solid rgba(0,212,255,0.2); border-radius: 0 28px 0 0; }
.corner-deco.bl { bottom: 0; left: 0; border-bottom: 2px solid rgba(0,212,255,0.2); border-left: 2px solid rgba(0,212,255,0.2); border-radius: 0 0 0 28px; }
.corner-deco.br { bottom: 0; right: 0; border-bottom: 2px solid rgba(255,123,0,0.3); border-right: 2px solid rgba(255,123,0,0.3); border-radius: 0 0 28px 0; }

.icon-wrap {
    width: 72px; height: 72px;
    border-radius: 20px;
    background: rgba(255,123,0,0.08);
    border: 1px solid rgba(255,123,0,0.2);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 22px;
    animation: iconPulse 2s ease-in-out infinite alternate;
    box-shadow: 0 0 30px rgba(255,123,0,0.1);
}
@keyframes iconPulse { from { box-shadow: 0 0 10px rgba(255,123,0,0.1); } to { box-shadow: 0 0 30px rgba(255,123,0,0.3); } }

.cyber-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 9px; color: var(--cyber-blue);
    letter-spacing: 4px; margin-bottom: 10px;
    opacity: 0.8; display: flex; align-items: center; justify-content: center; gap: 12px;
}
.cyber-label::before, .cyber-label::after { content: ''; width: 24px; height: 1px; background: var(--cyber-blue); box-shadow: 0 0 8px var(--cyber-blue); }

.card-title {
    font-family: 'Rajdhani', sans-serif;
    font-size: 28px; font-weight: 700;
    color: #fff; margin-bottom: 8px;
}
.card-subtitle {
    font-family: 'Rajdhani', sans-serif;
    font-size: 14px; color: var(--text-sub);
    margin-bottom: 30px; line-height: 1.5;
}

.form-section-label {
    font-family: 'Orbitron', sans-serif;
    font-size: 8px; color: var(--cyber-blue);
    letter-spacing: 3px; text-transform: uppercase;
    margin-bottom: 12px; text-align: left;
    display: flex; align-items: center; gap: 10px; opacity: 0.8;
}
.form-section-label::after { content: ''; flex: 1; height: 1px; background: linear-gradient(90deg, rgba(0,212,255,0.3), transparent); }

.input-group { position: relative; margin-bottom: 20px; }
.input-group input {
    width: 100%;
    padding: 14px 20px 14px 50px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.07);
    background: rgba(255,255,255,0.02);
    color: #fff; outline: none;
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px; font-weight: 500;
    transition: all 0.3s; box-sizing: border-box;
}
.input-group input::placeholder { color: var(--text-muted); }
.input-group input:focus {
    border-color: rgba(255,123,0,0.5);
    background: rgba(255,123,0,0.04);
    box-shadow: 0 0 0 3px rgba(255,123,0,0.1);
}
.input-icon { position: absolute; left: 17px; top: 50%; transform: translateY(-50%); color: var(--text-muted); display: flex; align-items: center; pointer-events: none; transition: color 0.3s; }
.input-group input:focus ~ .input-icon { color: var(--primary); }

.submit-btn {
    width: 100%; padding: 15px;
    background: linear-gradient(135deg, #ff7b00 0%, #ff4400 100%);
    color: #fff; border: none; border-radius: 14px;
    cursor: pointer; font-family: 'Orbitron', sans-serif;
    font-weight: 700; font-size: 11px; letter-spacing: 3px;
    text-transform: uppercase; transition: all 0.3s cubic-bezier(0.23,1,0.32,1);
    box-shadow: 0 6px 30px rgba(255,123,0,0.35);
    position: relative; overflow: hidden;
}
.submit-btn::before { content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%; background: linear-gradient(90deg, transparent, rgba(255,255,255,0.25), transparent); transition: left 0.5s; }
.submit-btn:hover::before { left: 120%; }
.submit-btn:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(255,123,0,0.6); }

.back-link {
    display: block; margin-top: 20px;
    font-family: 'Rajdhani', sans-serif; font-size: 14px; font-weight: 600;
    color: var(--primary); text-decoration: none; letter-spacing: 0.5px;
    transition: all 0.3s;
}
.back-link:hover { color: #ff9d00; text-shadow: 0 0 10px rgba(255,123,0,0.5); }
.hud-status { margin-top: 18px; font-family: 'Orbitron', monospace; font-size: 8px; color: var(--text-muted); letter-spacing: 2px; opacity: 0.4; }

/* ═══════════════════════════════════════════════════
   RESPONSIVE – FORM PAGES (login/register/otp/password)
═══════════════════════════════════════════════════ */

/* Prevent iOS zoom on input focus */
input, select, textarea {
    font-size: 16px !important;
}

/* General */
body, html {
    overflow-x: hidden;
    max-width: 100vw;
}

img {
    max-width: 100%;
}

/* ── Tablet ── */
@media (max-width: 768px) {
    .login-card,
    .register-card,
    .card,
    .auth-card {
        width: 92vw !important;
        max-width: 480px !important;
        padding: 36px 24px 32px !important;
        border-radius: 18px !important;
    }

    input[type="text"],
    input[type="email"],
    input[type="password"],
    input[type="number"],
    input[type="tel"] {
        font-size: 16px !important;
        min-height: 48px !important;
    }

    button[type="submit"],
    .login-btn,
    .register-btn,
    .submit-btn,
    .reset-btn {
        min-height: 48px !important;
        font-size: 14px !important;
        width: 100% !important;
    }
}

/* ── Mobile ── */
@media (max-width: 480px) {
    .login-card,
    .register-card,
    .card,
    .auth-card {
        width: 95vw !important;
        padding: 28px 18px 24px !important;
    }

    .logo-wrap img {
        width: 130px !important;
    }

    .form-row {
        flex-direction: column !important;
        gap: 0 !important;
    }
}

</style>

<div class="bg-canvas" id="bgCanvas"></div>
<div class="scan-beam"></div>

<div class="card">
    <div class="corner-deco tl"></div><div class="corner-deco tr"></div>
    <div class="corner-deco bl"></div><div class="corner-deco br"></div>

    <div class="icon-wrap">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#ff7b00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/><circle cx="12" cy="16" r="1" fill="#ff7b00"/></svg>
    </div>

    <div class="cyber-label">Security Protocol</div>
    <div class="card-title">Reset Password</div>
    <div class="card-subtitle">Enter your email to receive a secure reset link.</div>

    <form method="POST">
        {% csrf_token %}
        <div class="form-section-label">Email Verification</div>
        <div class="input-group">
            <input type="email" name="email" placeholder="Your Email Address" required autocomplete="email">
            <div class="input-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            </div>
        </div>
        <button type="submit" class="submit-btn">Send Reset Link</button>
    </form>

    <a href="{% url 'login' %}" class="back-link">← Back to Login</a>
    <div class="hud-status">SYS-SECURE ◈ LookIn AI v2.0</div>
</div>

<script>
(function() {
    const canvas = document.getElementById('bgCanvas');
    const colors = ['rgba(255,123,0,', 'rgba(0,212,255,', 'rgba(123,47,255,'];
    for (let i = 0; i < 25; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        const size = Math.random() * 3 + 1;
        const color = colors[Math.floor(Math.random() * colors.length)];
        const opacity = Math.random() * 0.4 + 0.1;
        p.style.cssText = `width:${size}px;height:${size}px;left:${Math.random()*100}%;background:${color}${opacity});box-shadow:0 0 ${size*3}px ${color}0.6);animation-duration:${Math.random()*15+10}s;animation-delay:${Math.random()*10}s;`;
        canvas.appendChild(p);
    }
})();
</script>
