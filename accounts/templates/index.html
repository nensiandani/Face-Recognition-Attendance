{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LookIn AI | Face Recognition System</title>

    {% include 'header.html' %}

    <style>
        /* ========== PREMIUM DARK AI THEME ========== */
        :root {
            --primary: #ff7b00;
            --primary-glow: rgba(255, 123, 0, 0.5);
            --bg-dark: #0b0f19;
            --bg-panel: rgba(15, 23, 42, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --text-muted: #94a3b8;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: radial-gradient(circle at top left, #1a233a 0%, #0b0f19 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            overflow-x: hidden; /* Screen ni bahar javano rasto bandh */
        }

        body::before {
            content: '';
            position: absolute;
            top: -20%; left: -10%;
            width: 400px; height: 400px;
            background: rgba(255, 123, 0, 0.12);
            filter: blur(100px);
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            bottom: -20%; right: -10%;
            width: 400px; height: 400px;
            background: rgba(0, 198, 255, 0.08);
            filter: blur(100px);
            z-index: 0;
        }

        /* ========== GLASS CARD (MOBILE FIRST) ========== */
        .container {
            width: 90%; /* Box screen karta 90% j moto rehse, kapase nahi */
            max-width: 650px; 
            margin: 20px auto; 
            padding: 40px 20px; 
            text-align: center;
            background: var(--bg-panel);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.5);
            border: 1px solid var(--glass-border);
            border-top: 1px solid rgba(255, 255, 255, 0.15);
            position: relative;
            z-index: 1;
        }

        .logo-img {
            width: 180px; 
            margin-bottom: 15px;
            filter: drop-shadow(0 10px 15px rgba(0, 0, 0, 0.5));
            animation: floatLogo 4s ease-in-out infinite;
        }

        @keyframes floatLogo {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0px); }
        }

        .container h1 {
            font-size: 32px; 
            font-weight: 800;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .container h1 span {
            color: var(--primary);
        }

        .container p {
            font-size: 14px;
            line-height: 1.6;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        /* ========== BUTTON GROUP ========== */
        .buttons {
            display: flex;
            flex-direction: column; /* Mobile ma ubha button */
            gap: 15px;
            width: 100%;
        }

        .btn {
            width: 100%; 
            padding: 15px 20px;
            border-radius: 12px;
            font-size: 14px;
            font-weight: 700;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            display: block;
        }

        .btn-login {
            background: linear-gradient(135deg, #ff7b00 0%, #ff5500 100%);
            color: white;
            border: none;
            box-shadow: 0 6px 20px var(--primary-glow);
        }

        .btn-register {
            border: 2px solid rgba(255, 255, 255, 0.2);
            color: white;
            background: transparent;
        }

        /* ========== PC DESKTOP SETTINGS ========== */
        @media (min-width: 600px) {
            .container { padding: 60px 50px; }
            .logo-img { width: 250px; }
            .container h1 { font-size: 42px; }
            .container p { font-size: 16px; }
            .buttons { flex-direction: row; justify-content: center; }
            .btn { width: auto; padding: 15px 40px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="{% static 'img/logo2.png' %}" class="logo-img" alt="LookIn Logo" />
        <h1>LookIn <span>AI</span></h1>
        <p>
            Real-time face recognition from camera feeds. Automated attendance,
            smart visitor tracking, and intelligent access control — all in one
            powerful, secure platform.
        </p>
        <div class="buttons">
            <a href="{% url 'login' %}" class="btn btn-login">Login Securely</a>
            <a href="{% url 'register' %}" class="btn btn-register">Request Access</a>
        </div>
    </div>
</body>
</html>
